# M3 Task 3: Frigate daemon real config. Rendered at FIRST start ONLY, by frigate-run
# (or validate-config) — (sed replaces __SNAP_COMMON__ and __SNAP__ tokens). Once
# config.yml exists, the OPERATOR owns it: delete the file and restart frigate to
# regenerate from this template (edits are never clobbered on subsequent starts).
# version pinned to CURRENT_CONFIG_VERSION (0.17-0) so migrate_frigate_config() does not rewrite.
mqtt:
  enabled: false
# M5 Task 4: real auth — enabled: true + cookie_secure: true (TLS on :8971; Secure cookie correct).
# Placed OUTSIDE the LIVECAM-BEGIN/END cameras block so both render branches keep it.
# Fresh bootstrap: purge cycle (snap remove --purge) empties DB → init_auth logs admin password once:
#   journal pattern: ***    Password: <32-hex>   ***  (frigate/app.py init_auth)
# cookie_secure: true — Secure flag on frigate_token: browsers only send token over HTTPS.
auth:
  enabled: true
  cookie_secure: true
# M5 Task 4: explicit tls: enabled: true (certsync's disabled-branch grep reads this block).
# Frigate Python app TLS awareness; nginx TLS is configured in listen.conf (Task 2 plumbing).
tls:
  enabled: true
database:
  path: __SNAP_COMMON__/db/frigate.db
# M7 detector render: frigate-run/validate-config keep ONE of the three marker-wrapped blocks
# below (snap-set `detector` = ov|coral|cpu; unset => auto-detect: renderD* present => ov, else
# cpu) and delete the other two regions at render time. Markers are stripped from the kept block,
# leaving a plain `detectors:` -> `model:` -> `cameras:` shape (the M6 coral phase awk transform
# anchors on ^detectors:/^cameras: in the RENDERED file and depends on that shape). Upstream
# v0.17.2 supports ONE model geometry across all detectors, so each block carries its own model:.
# DETECTOR-OV-BEGIN
detectors:
  ov:
    type: openvino
    device: GPU
model:
  # OV SSDLite MobileNet V2: converted via openvino-dev 2024.6 with reverse_input_channels=True
  # (model accepts BGR; TF model originally RGB, MO adds channel-reversal preprocessing).
  # Labelmap: 91-class COCO bkgr variant (coco_91cl_bkgr.txt) as upstream Dockerfile pairs
  # with this model (90-class labelmap.txt would mismap outputs).
  path: /opt/frigate/models/openvino/ssdlite_mobilenet_v2.xml
  labelmap_path: /opt/frigate/models/openvino/coco_91cl_bkgr.txt
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  model_type: ssd
# DETECTOR-OV-END
# DETECTOR-CPU-BEGIN
detectors:
  cpu:
    type: cpu
model:
  # CPU fallback: ssdlite_mobiledet_coco_qat_postprocess tflite (c21de44); same COCO 90-class
  # labelmap.txt and 320x320 nhwc/rgb/ssd geometry as the Coral EdgeTPU sibling below.
  path: /opt/frigate/models/cpu/cpu_model.tflite
  labelmap_path: /opt/frigate/models/labelmap.txt
  width: 320
  height: 320
  input_tensor: nhwc
  input_pixel_format: rgb
  model_type: ssd
# DETECTOR-CPU-END
# DETECTOR-CORAL-BEGIN
detectors:
  coral:
    type: edgetpu
    device: usb
model:
  # M6 Coral phase: EdgeTPU compilation of the CPU-fallback network (c21de44)
  path: /opt/frigate/models/edgetpu/edgetpu_model.tflite
  labelmap_path: /opt/frigate/models/labelmap.txt
  width: 320
  height: 320
  input_tensor: nhwc
  input_pixel_format: rgb
  model_type: ssd
# DETECTOR-CORAL-END
cameras:
  # LIVECAM-BEGIN
  # Live camera (M3 re-arm): rendered ONLY when the operator has provisioned
  # $SNAP_COMMON/livecam-url (single line: full stream URL incl. any credentials; root:root 0600).
  # frigate-run/validate-config substitute the URL token below at render time (umask 077 render;
  # M4 Task 0 NOTE: keep the literal token text OUT of comments — sed would inject the credential
  # into the comment too); when the file is absent this marker-delimited block is stripped.
  # The URL must never appear in committed files, harness output, or evidence (harness scrubs).
  # The harness preserves the file across its remove --purge/reinstall cycle.
  # Caveat: '|', '&', '\' in the URL/credentials are unsupported (sed replacement semantics:
  # '|' is the delimiter; '&' expands to the whole match; '\' is the escape prefix). M5/M7: switch
  # to a literal-safe renderer.
  # detect width/height intentionally omitted: Frigate autodetects via ffprobe.
  livecam:
    ffmpeg:
      inputs:
        - path: __LIVECAM_URL__
          roles: [detect, record]
    detect:
      enabled: true
      fps: 5
    objects:
      # person only: the provisioned camera watches an indoor living room (no cars indoors)
      track: [person]
  # LIVECAM-END
  testclip:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/testclip
          roles: [detect, record]
    detect:
      enabled: true
      # Detect at 1280x720 (downscale from 1920x1080 source; Frigate resizes to model 300x300 anyway).
      # Documented downscale: reduces frame-buffer memory and FFmpeg scaling load during spike.
      width: 1280
      height: 720
      fps: 5
    objects:
      track: [person, car]
record:
  enabled: true
  continuous:
    days: 1
version: "0.17-0"
