# M7 Task 3: rotate nginx's access/error logs (bin/logrotate-run, oneshot timer app).
# logrotate is a plain config file — it CANNOT expand $SNAP_DATA — so the glob uses the stable
# /var/snap/frigate/current path (snapd maintains the `current` symlink → the active revision's
# $SNAP_DATA, so this always resolves to $SNAP_DATA/nginx/logs/).
/var/snap/frigate/current/nginx/logs/*.log {
    size 10M
    rotate 3
    copytruncate
    missingok
    notifempty
}

# M8 Task 7: rotate the /logs tee sinks (real frigate/go2rtc stdout captured by the
# process-substitution tees in bin/frigate-run and bin/go2rtc-run). Both live on bounded backing
# stores (frigate on the private /dev/shm tmpfs; go2rtc in $SNAP_DATA), so keep only 1 rotation and
# copytruncate (the daemons hold the file open via tee — truncate-in-place, no reopen signal). The
# go2rtc sink is $SNAP_DATA/go2rtc-logs/current (its own writable area — go2rtc has no shm-private
# plug); frigate's sink is the only /dev/shm entry, which is why the logrotate app needs shm-private.
/var/snap/frigate/current/go2rtc-logs/current /dev/shm/logs/frigate/current {
    size 10M
    rotate 1
    copytruncate
    missingok
    notifempty
}
