name: frigate
version: '0.0.1-spike'
summary: Frigate snap M0 de-risking spike (throwaway probes, not Frigate)
description: |
  Probe snap that answers the strict-confinement unknowns for the real
  Frigate snap. See docs/superpowers/specs/2026-07-02-frigate-snap-design.md.
base: core26
grade: devel
confinement: strict

layout:
  # NOTE: /config bind is REJECTED at pack time (snapd: "defines a new top-level directory").
  # /etc/letsencrypt is a sub-path of /etc (exists in base) and is accepted.
  # NOTE: /media/frigate ALSO REJECTED at pack time — same error: "defines a new top-level directory /media".
  # Implication for M3: recordings dir cannot use a /media/frigate layout; must configure Frigate's
  # BASE_DIR or recordings path directly to a $SNAP_COMMON path.
  /opt/frigate:
    bind: $SNAP/opt/frigate
  /etc/letsencrypt:
    bind: $SNAP_DATA/letsencrypt
  /etc/OpenCL:
    bind: $SNAP/etc/OpenCL
  /usr/lib/x86_64-linux-gnu/intel-opencl:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/intel-opencl
  /usr/lib/ffmpeg:
    bind: $SNAP/usr/lib/ffmpeg

slots:
  npu-dev:
    interface: custom-device
    custom-device: intel-npu
    devices:
      - /dev/accel/accel0

plugs:
  npu:
    interface: custom-device
    custom-device: intel-npu
  # Task 5 finding: glibc sem_open(O_CREAT) mknods a RANDOM /dev/shm/sem.XXXXXX tempfile,
  # so the sem.snap.<name>.* AppArmor rule can never match (python multiprocessing SemLock
  # -> PermissionError). private:true gives the snap its own /dev/shm tmpfs — the canonical fix.
  # SIZING NOTE: the private /dev/shm tmpfs uses the system default sizing (~50% RAM);
  # flag for M3 frame-buffer capacity planning (see task-5-report.md Fix round 1).
  shm-private:
    interface: shared-memory
    private: true

platforms:
  amd64:

apps:
  go2rtc:
    command: bin/go2rtc-run
    daemon: simple
    restart-condition: on-failure
    plugs: [network, network-bind]
  svc-a:
    command: bin/svc-a
    daemon: simple
    restart-condition: never
    after: [go2rtc]
    plugs: [network]
  svc-b:
    command: bin/svc-b
    daemon: simple
    restart-condition: never
    after: [svc-a]
  svc-c:
    command: bin/svc-c
    daemon: simple
    restart-condition: never
    after: [svc-b]
  gpu-probe:
    command: bin/gpu-probe
    extensions: [gpu]
    plugs: [opengl]
  coral-probe:
    command: bin/coral-probe
    plugs: [raw-usb, hardware-observe]
  npu-probe:
    command: bin/npu-probe
    plugs: [npu]
  mdns-probe:
    command: bin/mdns-probe
    plugs: [network, network-bind]
  ffprobe:
    command: usr/lib/ffmpeg/7.0/bin/ffprobe
    plugs: [network]
  vaapi-probe:
    command: bin/vaapi-probe
    extensions: [gpu]
    plugs: [opengl, network]
  frigate:
    command: bin/frigate-run
    daemon: simple
    restart-condition: on-failure
    after: [go2rtc]
    extensions: [gpu]
    # mount-observe: psutil.disk_partitions(all=True) reads /proc/<pid>/mounts to compute
    # /dev/shm fs-type for frame-buffer sizing (CameraMaintainer.__calculate_shm_frame_count).
    # Without this, PermissionError crashes the main process before the API can start.
    # Arm: expected/documented for the daemon — psutil mounts-read is a well-known snap pattern.
    plugs: [network, network-bind, opengl, shm-private, mount-observe]
  validate-config:
    command: bin/validate-config
    # network-bind: snapd seccomp gates listen(2) behind it (type=1326 syscall=50 evidence) —
    # python mp.forkserver's AF_UNIX control socket needs listen even without inet sockets.
    # shm-private: POSIX named semaphores (mp.Manager) need a writable private /dev/shm.
    plugs: [network, network-bind, shm-private]

parts:
  python311:
    plugin: nil
    source: https://www.python.org/ftp/python/3.11.9/Python-3.11.9.tgz
    build-packages:
      - build-essential
      - pkg-config
      - libssl-dev
      - zlib1g-dev
      - libffi-dev
      - libsqlite3-dev
      - libbz2-dev
      - liblzma-dev
      - libreadline-dev
      - uuid-dev
    override-build: |
      ./configure --prefix=/usr --enable-shared --with-ensurepip=install \
        LDFLAGS="-Wl,-rpath,/snap/frigate/current/usr/lib"
      make -j"$(nproc)"
      make install DESTDIR="$CRAFT_PART_INSTALL"
  spike-wheels:
    plugin: nil
    after: [python311]
    # source deliberately isolated: probe edits must not retrigger this 500MB build
    source: wheels-src
    stage-packages:
      - libgl1
    override-build: |
      export LD_LIBRARY_PATH="$CRAFT_STAGE/usr/lib:${LD_LIBRARY_PATH:-}"
      "$CRAFT_STAGE/usr/bin/python3.11" -m pip install --no-cache-dir \
        --root "$CRAFT_PART_INSTALL" --prefix /usr \
        -r requirements-core.txt
      # Remove packages already staged by python311 (ensurepip) to avoid staging conflicts.
      # Guard: pip reports "already satisfied" on re-runs (packages found in stage); in that
      # case CRAFT_PART_INSTALL/site-packages is absent and the cleanup is a no-op.
      SP="$CRAFT_PART_INSTALL/usr/lib/python3.11/site-packages"
      if [ -d "$SP" ]; then
        rm -rf "$SP/setuptools" "$SP/_distutils_hack" "$SP/pkg_resources"
        find "$SP" -maxdepth 1 \( \
          -name 'setuptools-*.dist-info' -o \
          -name 'distutils-precedence.pth' \
        \) -exec rm -rf {} +
      fi
  probes:
    plugin: dump
    source: probes
    organize:
      '*': probes/
  libedgetpu:
    plugin: nil
    build-packages: [wget]
    stage-packages: [libusb-1.0-0]
    override-build: |
      wget -O /tmp/libedgetpu.deb "https://github.com/feranick/libedgetpu/releases/download/16.0TF2.17.1-1/libedgetpu1-max_16.0tf2.17.1-1.bookworm_amd64.deb"
      echo "63fd00989d29160fa9894e115156a9abe456e88751fc9be89d26e4696200441b  /tmp/libedgetpu.deb" | sha256sum -c -
      dpkg-deb -x /tmp/libedgetpu.deb "$CRAFT_PART_INSTALL"
  va-tools:
    plugin: nil
    stage-packages:
      - vainfo
      - ocl-icd-libopencl1   # ICD loader: provides libOpenCL.so.1 for OpenVINO GPU plugin
      - intel-opencl-icd     # Intel compute runtime: provides libigdrcl.so + /etc/OpenCL/vendors/intel.icd
      - libigdgmm12           # libigdrcl.so runtime dependency (Intel Graphics Memory Manager)
  coral-model:
    plugin: nil
    build-packages: [wget]
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/models"
      wget -O "$CRAFT_PART_INSTALL/models/edgetpu-test.tflite" \
        https://github.com/google-coral/test_data/raw/master/mobilenet_v2_1.0_224_inat_bird_quant_edgetpu.tflite
      echo "5b468dfe63ce4d79056bb19b953529e25df0a8d841b204c626576a1b8bd36afe  $CRAFT_PART_INSTALL/models/edgetpu-test.tflite" | sha256sum -c -
  wrappers:
    plugin: dump
    source: bin
    organize:
      '*': bin/
  ffmpeg:
    plugin: nil
    build-packages: [wget, xz-utils, bzip2]
    override-build: |
      # --- 8.0 tree (autobuild, pinned) — temps migrated to $CRAFT_PART_BUILD (M1 review fix) ---
      wget -O "$CRAFT_PART_BUILD/ffmpeg-8.tar.xz" "https://github.com/NickM-27/FFmpeg-Builds/releases/download/autobuild-2026-06-02-14-20/ffmpeg-n8.1.1-9-g58d4114d36-linux64-gpl-8.1.tar.xz"
      echo "9bac85054d351cdc89c0a4f45c8ea5c44df94009aabd964b719bbadd56aedae9  $CRAFT_PART_BUILD/ffmpeg-8.tar.xz" | sha256sum -c -
      mkdir -p "$CRAFT_PART_BUILD/f8" && tar -xJf "$CRAFT_PART_BUILD/ffmpeg-8.tar.xz" -C "$CRAFT_PART_BUILD/f8" --strip-components=1
      install -D -m 0755 "$CRAFT_PART_BUILD/f8/bin/ffmpeg"  "$CRAFT_PART_INSTALL/usr/lib/ffmpeg/8.0/bin/ffmpeg"
      install -D -m 0755 "$CRAFT_PART_BUILD/f8/bin/ffprobe" "$CRAFT_PART_INSTALL/usr/lib/ffmpeg/8.0/bin/ffprobe"
      # --- 5.0 tree (tag-exact, v0.17.2 install_deps.sh) ---
      wget -O "$CRAFT_PART_BUILD/ffmpeg-5.tar.xz" "https://github.com/NickM-27/FFmpeg-Builds/releases/download/autobuild-2022-07-31-12-37/ffmpeg-n5.1-2-g915ef932a3-linux64-gpl-5.1.tar.xz"
      echo "377abec133f9d9e8014dee1b91c9684ac8bb0b5b7d80100a57116ff837c4c0d4  $CRAFT_PART_BUILD/ffmpeg-5.tar.xz" | sha256sum -c -
      mkdir -p "$CRAFT_PART_BUILD/f5" && tar -xJf "$CRAFT_PART_BUILD/ffmpeg-5.tar.xz" -C "$CRAFT_PART_BUILD/f5" --strip-components=1 amd64/bin/ffmpeg amd64/bin/ffprobe
      install -D -m 0755 "$CRAFT_PART_BUILD/f5/bin/ffmpeg"  "$CRAFT_PART_INSTALL/usr/lib/ffmpeg/5.0/bin/ffmpeg"
      install -D -m 0755 "$CRAFT_PART_BUILD/f5/bin/ffprobe" "$CRAFT_PART_INSTALL/usr/lib/ffmpeg/5.0/bin/ffprobe"
      # --- 7.0 tree (tag-exact default; tarball is bzip2 despite .xz name — use tar -xf for auto-detect) ---
      wget -O "$CRAFT_PART_BUILD/ffmpeg-7.tar.xz" "https://github.com/NickM-27/FFmpeg-Builds/releases/download/autobuild-2024-09-19-12-51/ffmpeg-n7.0.2-18-g3e6cec1286-linux64-gpl-7.0.tar.xz"
      echo "e13860eb90409c8218319c928067834ce450128e86f24cfed5cfe91ce6e31037  $CRAFT_PART_BUILD/ffmpeg-7.tar.xz" | sha256sum -c -
      mkdir -p "$CRAFT_PART_BUILD/f7" && tar -xf "$CRAFT_PART_BUILD/ffmpeg-7.tar.xz" -C "$CRAFT_PART_BUILD/f7" --strip-components=1 amd64/bin/ffmpeg amd64/bin/ffprobe
      install -D -m 0755 "$CRAFT_PART_BUILD/f7/bin/ffmpeg"  "$CRAFT_PART_INSTALL/usr/lib/ffmpeg/7.0/bin/ffmpeg"
      install -D -m 0755 "$CRAFT_PART_BUILD/f7/bin/ffprobe" "$CRAFT_PART_INSTALL/usr/lib/ffmpeg/7.0/bin/ffprobe"
  go2rtc:
    plugin: nil
    build-packages: [wget]
    override-build: |
      wget -O /tmp/go2rtc "https://github.com/AlexxIT/go2rtc/releases/download/v1.9.13/go2rtc_linux_amd64"
      echo "dce491325c28890ad0b85e83090753dc111b903ef83f43b834798f9114520dba  /tmp/go2rtc" | sha256sum -c -
      install -D -m 0755 /tmp/go2rtc "$CRAFT_PART_INSTALL/usr/local/go2rtc/bin/go2rtc"
  go2rtc-config:
    plugin: dump
    source: config
    organize:
      '*': config/
  frigate-src:
    plugin: nil
    source: https://github.com/blakeblackshear/frigate.git
    source-tag: v0.17.2
    source-depth: 1
    override-build: |
      patch -p1 < "$CRAFT_PROJECT_DIR/patches/0001-env-driven-paths.patch"
      # NOTE (2026-07-05 user ruling): NO behavior patches beyond 0001. A motion-calibration
      # patch (forced exit after 60 frames) was trialed because the looping test clip's
      # constant motion never satisfies stock calibration exit (pct_motion < 5%), and the
      # config alternative motion.enabled=false is hard-rejected by v0.17.2 validation when
      # detect.enabled=true. Ruling: run STOCK code; the detection money test is POSTPONED
      # until live cameras (natural quiet intervals) are available. See docs/patches.md.
      # frigate/version.py is generated at build time upstream (Makefile `version` target:
      # echo 'VERSION = "$(VERSION)-$(COMMIT_HASH)"' > frigate/version.py) — not in the git tree.
      echo "VERSION = \"0.17.2-$(git rev-parse --short HEAD)\"" > frigate/version.py
      mkdir -p "$CRAFT_PART_INSTALL/opt/frigate"
      cp -r frigate migrations "$CRAFT_PART_INSTALL/opt/frigate/"
      # Upstream Dockerfile COPYs labelmap.txt / audio-labelmap.txt to the image root; / is
      # not writable in a snap, so stage them with the source; the config template points
      # model.labelmap_path at /opt/frigate/labelmap.txt (reachable via the Task-2 layout).
      # audio-labelmap.txt: runtime-only (events/audio.py:373); staged proactively mirroring
      # upstream Dockerfile — not forced by a validation error.
      cp labelmap.txt audio-labelmap.txt "$CRAFT_PART_INSTALL/opt/frigate/"
  # M3 Task 1: OpenVINO SSDLite (prebuilt IR) + CPU tflite fallback + labelmaps.
  # Route: prebuilt — openvino.tools.mo was removed in openvino 2024.0 (staged
  # version is 2025.3.0); ovc dropped TF OD API params (pipeline_config,
  # transformations_config) required for SSD [1,1,N,7] output; build-time
  # conversion would add tensorflow (~600 MB) as an extra pip dep. Converted
  # once on host using openvino-dev==2024.6.0 + tensorflow==2.17. See README.
  detector-models:
    plugin: nil
    source: models-prebuilt
    build-packages: [wget]
    override-build: |
      # --- OpenVINO SSDLite IR (prebuilt; MO-converted, FP16, SSD-transformed) ---
      # ssdlite_mobilenet_v2 from TF Model Zoo; output shape [1,1,N,7] for Frigate SSD handler
      echo "1de65ab321104005ae89713cd062432bb49663f84c69756a80e565acb0b8e4c4  $CRAFT_PART_SRC/ssdlite_mobilenet_v2.xml" | sha256sum -c -
      install -D -m 0644 "$CRAFT_PART_SRC/ssdlite_mobilenet_v2.xml" \
        "$CRAFT_PART_INSTALL/opt/frigate/models/openvino/ssdlite_mobilenet_v2.xml"
      echo "e9ae61499b401144f6fa3bc08785d55bdfbb8ab706b58c870755830cc04663d3  $CRAFT_PART_SRC/ssdlite_mobilenet_v2.bin" | sha256sum -c -
      install -D -m 0644 "$CRAFT_PART_SRC/ssdlite_mobilenet_v2.bin" \
        "$CRAFT_PART_INSTALL/opt/frigate/models/openvino/ssdlite_mobilenet_v2.bin"
      # OpenVINO labelmap: coco_91cl_bkgr.txt with truck->car patch (upstream Dockerfile line 136)
      echo "710061971626db24bab3bae6ff4e9ce6e66650565990123f3f86f12d385b37d1  $CRAFT_PART_SRC/coco_91cl_bkgr.txt" | sha256sum -c -
      install -D -m 0644 "$CRAFT_PART_SRC/coco_91cl_bkgr.txt" \
        "$CRAFT_PART_INSTALL/opt/frigate/models/openvino/coco_91cl_bkgr.txt"
      # --- CPU tflite fallback (downloaded; pinned) ---
      # ssdlite_mobiledet_coco_qat_postprocess from google-coral test_data (commit c21de44)
      wget -qO "$CRAFT_PART_BUILD/cpu_model.tflite" \
        "https://github.com/google-coral/test_data/raw/c21de4450f88a20ac5968628d375787745932a5a/ssdlite_mobiledet_coco_qat_postprocess.tflite"
      echo "90bb33a634e041914cc1819aa5df99818e6c396c4d2db952c0fd7a9cffc4724f  $CRAFT_PART_BUILD/cpu_model.tflite" | sha256sum -c -
      install -D -m 0644 "$CRAFT_PART_BUILD/cpu_model.tflite" \
        "$CRAFT_PART_INSTALL/opt/frigate/models/cpu/cpu_model.tflite"
      # --- COCO labelmap (pinned; same as frigate-src top-level copy) ---
      echo "e23585f859d6a93827443fde9fe99ece7195dd856648af9ecb6bc6cf05f9b4d2  $CRAFT_PART_SRC/labelmap.txt" | sha256sum -c -
      install -D -m 0644 "$CRAFT_PART_SRC/labelmap.txt" \
        "$CRAFT_PART_INSTALL/opt/frigate/models/labelmap.txt"

  # M3 Task 2: CC0 pedestrian clip for real-object detection testing.
  # Source: Wikimedia Commons CC0 1.0 (see spike/LICENSE-testclip).
  # The file is a pre-converted h264/mp4 (converted from the CC0 WebM source)
  # committed to the spike source tree alongside the prebuilt model binaries.
  # Conversion avoids Wikimedia rate-limiting during snap builds; provenance
  # and sha256 of both source WebM and converted MP4 are in LICENSE-testclip.
  test-clip:
    plugin: nil
    source: media-samples
    override-build: |
      echo "38df1538cd58333a55111579367b6150df62c2ae521969dd1c1bb5631a45c887  $CRAFT_PART_SRC/testclip.mp4" | sha256sum -c -
      install -D -m 0644 "$CRAFT_PART_SRC/testclip.mp4" "$CRAFT_PART_INSTALL/media-samples/testclip.mp4"

  # Task 5 import-chain additions: modules hard-imported (module level) by the
  # `python3 -m frigate --validate-config` chain but absent from the core-58 wheel set.
  # Separate part so the big spike-wheels part stays cached. Upstream pins from
  # docker/main/requirements-wheels.txt: sherpa-onnx==1.12.*, librosa==0.11.*,
  # soundfile==0.13.*, transformers==4.45.*, pandas==2.2.*; py3nvml is an unpinned git dep
  # upstream -> nearest pinned release; regex is transitive upstream (via transformers) but
  # directly imported by frigate.embeddings. NOTE: all of these are DEFERRED-frigate-ai.txt
  # entries — the deferred-AI companion-snap plan does not survive frigate's import graph
  # (module-level imports in embeddings/data_processing/api); recorded as an M2 finding.
  # Pins below use RESOLVED exact versions from the installed snap (M2 fix round 1).
  validate-deps:
    plugin: nil
    after: [python311, spike-wheels]
    override-build: |
      export LD_LIBRARY_PATH="$CRAFT_STAGE/usr/lib:${LD_LIBRARY_PATH:-}"
      "$CRAFT_STAGE/usr/bin/python3.11" -m pip install --no-cache-dir \
        --root "$CRAFT_PART_INSTALL" --prefix /usr \
        "py3nvml==0.2.7" "regex==2024.11.6" "sherpa-onnx==1.12.40" \
        "librosa==0.11.0" "soundfile==0.13.1" \
        "transformers==4.45.2" "pandas==2.2.3"
      # Same dedupe guard as spike-wheels: drop packages already staged by python311.
      SP="$CRAFT_PART_INSTALL/usr/lib/python3.11/site-packages"
      if [ -d "$SP" ]; then
        rm -rf "$SP/setuptools" "$SP/_distutils_hack" "$SP/pkg_resources"
        find "$SP" -maxdepth 1 \( \
          -name 'setuptools-*.dist-info' -o \
          -name 'distutils-precedence.pth' \
        \) -exec rm -rf {} +
      fi
