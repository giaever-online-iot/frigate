name: Promote to beta

# NEW for M7 (no zwave-js-ui source equivalent): a manual, human-triggered
# promotion from latest/edge to latest/beta. Latest-only milestone (spec's
# latest-only ruling) — there is no candidate/stable step here, just edge -> beta.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: >-
          Optional: exact store revision number to release to latest/beta
          instead of whatever currently sits in latest/edge. Leave blank for
          the default behaviour (promote latest/edge as-is).
        required: false
        type: string

permissions:
  contents: read

# Same group as release-on-merge.yml: a merge-triggered edge promotion and a
# manual beta promotion must not race on overlapping channels.
concurrency:
  group: snap-release
  cancel-in-progress: false

env:
  SNAP_NAME: frigate

jobs:
  promote-beta:
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Promote latest/edge -> latest/beta
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          set -a; . .github/release-archs.env; set +a
          if [ -n "$REVISION" ]; then
            echo ">> releasing revision $REVISION -> latest/beta"
            .github/scripts/release-arch.sh --revision "$REVISION" latest/beta "$BETA_ARCHS"
          else
            echo ">> promoting latest/edge -> latest/beta"
            .github/scripts/release-arch.sh latest/edge latest/beta "$BETA_ARCHS"
          fi
